{% set name = "botocore" %}
{% set version = "1.43.68" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a6c7ac88724c96f2ad5a7657f87d545d8218a74a1b219ba4397e3d37481941cd

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools >=71.1.0
    - wheel >=0.46.3
    - packaging >=24.1
  run:
    - python
    - jmespath >=0.7.1,<2.0.0
    - python-dateutil >=2.1,<3.0.0
    - urllib3 >=1.25.4,!=2.2.0,<3
    # botocore uses certifi when importable, instead of vendored cacert.pem
    - certifi
  run_constrained:
    # crt
    - awscrt >=0.36.0 # loosened to ensure broader compatibility

test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - botocore
    - botocore.args
    - botocore.auth
    - botocore.awsrequest
    - botocore.client
    - botocore.compat
    - botocore.compress
    - botocore.config
    - botocore.configloader
    - botocore.configprovider
    - botocore.context
    - botocore.credentials
    - botocore.crt
    - botocore.discovery
    - botocore.docs
    - botocore.endpoint
    - botocore.endpoint_provider
    - botocore.errorfactory
    - botocore.eventstream
    - botocore.exceptions
    - botocore.handlers
    - botocore.history
    - botocore.hooks
    - botocore.httpchecksum
    - botocore.httpsession
    - botocore.loaders
    - botocore.model
    - botocore.monitoring
    - botocore.paginate
    - botocore.parsers
    - botocore.regions
    - botocore.response
    - botocore.retries
    - botocore.retries.base
    - botocore.retryhandler
    - botocore.serialize
    - botocore.session
    - botocore.signers
    - botocore.stub
    - botocore.tokens
    - botocore.translate
    - botocore.useragent
    - botocore.utils
    - botocore.validate
    - botocore.vendored
    - botocore.vendored.requests
    - botocore.vendored.requests.packages
    - botocore.vendored.requests.packages.urllib3
    - botocore.waiter
  commands:
    - pip check
    # conda-build exports REQUESTS_CA_BUNDLE="" when unset on the host
    # (conda_build/environ.py); botocore >=1.43.54 rejects empty CA-bundle
    # values at client creation. Neutralize it for the test run.
    # Addressed by https://github.com/conda/conda-build/pull/6083 (not released yet)
    - unset REQUESTS_CA_BUNDLE AWS_CA_BUNDLE # [unix]
    - set "REQUESTS_CA_BUNDLE=" && set "AWS_CA_BUNDLE=" # [win]
    # Integration tests are required to validate real AWS services like S3 and SQS, which are not available in our environment.
    # Leak tests are flaky.
    - pytest -n auto -ra tests -m "not slow" --ignore=tests/integration/ --ignore=tests/functional/leak/
  requires:
    - pip
    - pytest >=9.0.3
    - pytest-xdist >=3.5.0
    - jsonschema >=4.23.0
    - atomicwrites >=1.0 # [win]
    - colorama >0.3.0 # [win]

about:
  home: https://aws.amazon.com/sdk-for-python/
  license: Apache-2.0
  license_family: Apache
  license_file:
    - NOTICE
    - LICENSE.txt
    - tests/unit/auth/aws4_testsuite/LICENSE
    - tests/unit/auth/aws4_testsuite/NOTICE
  summary: Low-level, data-driven core of boto 3.
  description: |
    Provides the core functionality of Boto3, the AWS SDK for Python
  dev_url: https://github.com/boto/botocore
  doc_url: https://docs.aws.amazon.com/botocore/latest/

extra:
  recipe-maintainers:
    - pmlandwehr
    - hajapy
    - tkelman
    - ocefpaf
